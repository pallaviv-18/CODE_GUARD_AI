name: CI
on:
  push:
  pull_request:
jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://codeguard:placeholder@localhost:5432/codeguard?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ai-service/requirements-test.txt
      - run: python -m unittest discover -s ai-service/tests
